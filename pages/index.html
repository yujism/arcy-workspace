<!doctype html>
<html lang="id"><head><script>try{var t=localStorage.getItem('arcy-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t}catch(e){}</script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="Arcy Workspace — tasks, notes, and a calendar in your browser."/><meta name="color-scheme" content="light"/><link rel="icon" href="./favicon.svg"/><title>Arcy Workspace</title></head><body><div id="root"></div><script type="module" src="./main.tsx"></script></body></html>
